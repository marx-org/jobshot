name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@19c638349f725dc2e816f28c7d203d127e0d93ce
    with:
      release_branch: main
      node_version: '22'
      test_command: npm ci && npm run lint && npm run build
    secrets: inherit
    permissions:
      contents: write
      packages: write
