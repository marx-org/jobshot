name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@fbdef004eedaea7eca60573365396b34f41b4513
    with:
      release_branch: main
      node_version: '22'
      test_command: npm ci && npm run lint && npm run build
    secrets: inherit
    permissions:
      contents: write
      packages: write
