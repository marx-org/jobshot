name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    uses: marx-org/pfire-workflows/.github/workflows/docker-image.yml@776b87d7f227954ac4301a69d41ef8783bc9bb33
    with:
      release_branch: main
      node_version: '22'
      test_command: npm ci && npm run lint && npm run build
    secrets: inherit
    permissions:
      contents: write
      packages: write
